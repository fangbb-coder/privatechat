# ===================================================================
# Private Chat — nginx 反代配置（sslip.io + Let's Encrypt 免费证书）
#
# 适用场景：服务器有公网 IP（如 39.107.111.43），不想买域名，
#           用免费 wildcard DNS（sslip.io）把 IP 嵌入域名，
#           再用 Let's Encrypt 签发受浏览器信任的免费证书。
#
# 域名示例：39-107-111-43.sslip.io  （短横线版；点号版 39.107.111.43.sslip.io 亦可）
#           sslip.io 会把该域名解析回 39.107.111.43，无需注册任何账号。
#
# 前提：
#   1) 服务器 80 / 443 端口对外开放（Let's Encrypt HTTP-01 验证要用 80）
#   2) privatechat 容器已运行并映射到 127.0.0.1:8080（HOST_PORT=8080）
#   3) 已用 ./docker/deploy.sh --up 启动过，.env 存在
#
# 部署步骤（在服务器 root 执行）：
#   # 1) 安装 nginx + certbot
#   sudo apt update && sudo apt install -y nginx certbot python3-certbot-nginx
#
#   # 2) 部署本配置（把 IP 段换成你的实际公网 IP，域名随之改）
#   sudo cp docker/nginx-sslip.example.conf /etc/nginx/sites-available/privatechat-sslip
#   sudo ln -sf /etc/nginx/sites-available/privatechat-sslip /etc/nginx/sites-enabled/
#
#   # 3) 测试并重载（此时只有 80 块，443 还没证书）
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # 4) 申请证书（自动签发 + 生成 443 块 + 80→443 跳转 + 自动续期）
#   sudo certbot --nginx -d 39-107-111-43.sslip.io --redirect \
#        --agree-tos -m you@example.com -n
#
#   # 5) 修改项目 .env 放行新域名
#   ALLOWED_ORIGINS=https://39-107-111-43.sslip.io
#   ALLOWED_HOSTS=39-107-111-43.sslip.io
#   WS_ALLOWED_ORIGINS=https://39-107-111-43.sslip.io
#
#   # 6) 重启容器使后端配置生效
#   docker compose up -d
#
#   # 7) 验证（应返回 {"status":"healthy",...}，且浏览器不再报证书错误）
#   curl -s https://39-107-111-43.sslip.io/health
#
# 说明：
#   - 本文件初始只配 80 块；certbot --nginx 会自动复制其 location/反代头
#     到新生成的 443 块，并把 80 块改为 301 跳转到 443。
#   - X-Forwarded-Proto 用 $scheme：443 块里是 https，后端 FORCE_TLS 中间件放行。
#   - WebSocket 升级头已配，聊天长连接（ws/wss）可用。
#   - 旧 IP 访问 https://39.107.111.43/ 仍是自签证书（IP 无法签 Let's Encrypt），
#     请改用 sslip.io 域名访问，浏览器对旧 IP 的 HSTS 锁死随之绕开（新 origin）。
# ===================================================================

# ===== 80 块：Let's Encrypt 验证 + 反代（certbot 会改为跳转） =====
server {
    listen 80;
    server_name 39-107-111-43.sslip.io;

    # ---- 反代头（certbot 复制到 443 块，故两块都生效）----
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # 443 块为 https → 后端 FORCE_TLS 通过

    # ---- WebSocket 升级（聊天长连接必需）----
    proxy_http_version 1.1;
    proxy_set_header    Upgrade    $http_upgrade;
    proxy_set_header    Connection "upgrade";
    proxy_read_timeout  86400;

    location / {
        proxy_pass http://127.0.0.1:8080;   # privatechat 容器映射端口
    }
}
