services:
  privatechat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: privatechat:3.6.1
    container_name: privatechat
    restart: unless-stopped
    ports:
      - "9090:8080"
    env_file:
      - ../.env
    volumes:
      - chat-data:/app/data
      - chat-logs:/app/logs
      - chat-keys:/app/backend/keys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; req=urllib.request.Request('http://127.0.0.1:8080/health', headers={'Host':'localhost'}); sys.exit(0 if urllib.request.urlopen(req, timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  chat-data:
  chat-logs:
  chat-keys:
