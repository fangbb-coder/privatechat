services:
  privatechat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: privatechat:3.7.0
    container_name: privatechat
    restart: unless-stopped
    ports:
      - "9090:8080"
    env_file:
      - ../.env
    volumes:
      - chat-data:/app/data
      - chat-logs:/app/logs
      - chat-keys:/app/backend/keys
    healthcheck:
      # 不注入 Host 头:避免 ALLOWED_HOSTS 严格模式下健康检查被 TrustedHostMiddleware 拒绝
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  chat-data:
  chat-logs:
  chat-keys:
