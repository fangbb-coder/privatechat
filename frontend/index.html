<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'self';"/>
  <meta name="version" content="v3.6.0-2025-01-27"/>
  <title>Private Chat</title>
  <style>
    :root {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --bg-chat-mine: #95ec69;
      --bg-chat-other: #ffffff;
      --bg-chat-system: #fff3cd;
      --bg-header: #ededed;
      --bg-button: #07C160;
      --bg-button-hover: #06AD56;
      --bg-button-danger: #fa5151;
      --bg-button-danger-hover: #d63e3e;
      --text-primary: #333333;
      --text-secondary: #666666;
      --text-header: #333333;
      --border-color: #eeeeee;
      --shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    [data-theme="dark"] {
      --bg-primary: #1a1a1a;
      --bg-secondary: #2d2d2d;
      --bg-chat-mine: #0d4a29;
      --bg-chat-other: #3d3d3d;
      --bg-chat-system: #856404;
      --bg-header: #3a3a3a;
      --bg-button: #07C160;
      --bg-button-hover: #06AD56;
      --bg-button-danger: #fa5151;
      --bg-button-danger-hover: #d63e3e;
      --text-primary: #e0e0e0;
      --text-secondary: #b0b0b0;
      --text-header: #e0e0e0;
      --border-color: #444444;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      overflow-x: hidden; /* 防止水平滚动条 */
    }

    [data-theme="dark"] body {
      background: #1a1a1a;
      color: #e0e0e0;
    }

    #app {
      max-width: 800px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
      position: relative;
      overflow: hidden; /* 防止app容器本身出现滚动条 */
    }

    [data-theme="dark"] #app {
      background: #1a1a1a;
    }

    header {
      padding: 10px 15px;
      text-align: center;
      background: #ededed;
      color: #333;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 100;
      border-bottom: 1px solid #e0e0e0;
    }

    [data-theme="dark"] header {
      background: #3a3a3a;
      color: #e0e0e0;
      border-bottom-color: #444444;
    }

    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      position: relative;
    }

    .header-left {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-title {
      flex: 1;
      text-align: center;
      font-weight: 500;
      font-size: 16px;
    }

    .header-btn {
      background: transparent;
      border: none;
      color: #333;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background-color 0.2s;
    }

    [data-theme="dark"] .header-btn {
      color: #e0e0e0;
    }

    .header-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] .header-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .header-btn-danger {
      color: #fa5151;
    }

    .header-btn-danger:hover {
      background: rgba(250, 81, 81, 0.1);
    }

    /* 在线用户列表 */
    #online-users-panel {
      position: fixed;
      top: 50px;
      right: 0;
      background: var(--bg-secondary);
      border-left: 2px solid var(--border-color);
      padding: 15px;
      z-index: 200;
      display: none;
      box-shadow: var(--shadow);
      max-width: 300px;
      max-height: 60vh;
      overflow-y: auto;
    }

    #online-users-panel.show {
      display: block;
    }

    #online-users-panel h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: var(--text-primary);
    }

    .online-user {
      display: flex;
      align-items: center;
      padding: 8px;
      margin-bottom: 8px;
      background: var(--bg-primary);
      border-radius: 4px;
    }

    .online-user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-button);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      margin-right: 10px;
    }

    .online-user-info {
      flex: 1;
    }

    .online-user-name {
      font-weight: 500;
      font-size: 14px;
    }

    .online-user-status {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .user-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
    }

    .user-badge-admin {
      background: #ff9800;
      color: white;
    }

    /* 认证表单 - 微信风格 */
    #auth-forms {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
      max-width: 420px;
      margin: auto;
      width: 100%;
    }

    .auth-form {
      display: none;
      background: white;
      padding: 40px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] .auth-form {
      background: #2e2e2e;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    .auth-form.active {
      display: flex;
      flex-direction: column;
    }

    .form-title {
      text-align: center;
      color: #07C160;
      margin-bottom: 30px;
      font-size: 24px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 400;
      font-size: 14px;
      color: #333;
    }

    [data-theme="dark"] label {
      color: #e0e0e0;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      box-sizing: border-box;
      background: #fafafa;
      color: #333;
      transition: border-color 0.2s;
    }

    [data-theme="dark"] input {
      background: #3a3a3a;
      border-color: #4a4a4a;
      color: #e0e0e0;
    }

    input:focus {
      outline: none;
      border-color: #07C160;
      background: white;
    }

    [data-theme="dark"] input:focus {
      background: #4a4a4a;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      background: #07C160;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    button:hover {
      background: #06AD56;
    }

    button:active {
      background: #05994D;
      transform: scale(0.98);
    }

    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      color: #fa5151;
      margin-bottom: 15px;
      font-size: 14px;
      padding: 12px;
      background: #fef0f0;
      border-radius: 4px;
      display: none;
      border-left: 3px solid #fa5151;
    }

    [data-theme="dark"] .error {
      background: #3d1a1a;
      color: #ff9999;
      border-left-color: #ff6b6b;
    }

    .error.show {
      display: block;
    }

    .success {
      color: #07C160;
      margin-bottom: 15px;
      font-size: 14px;
      padding: 12px;
      background: #f0f9f4;
      border-radius: 4px;
      display: none;
      border-left: 3px solid #07C160;
    }

    [data-theme="dark"] .success {
      background: #1a3d28;
      color: #90d68b;
      border-left-color: #06AD56;
    }

    .success.show {
      display: block;
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .toggle-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    [data-theme="dark"] .toggle-link {
      color: #b0b0b0;
    }

    .toggle-link a {
      color: #07C160;
      text-decoration: none;
      cursor: pointer;
      font-weight: 500;
    }

    .toggle-link a:hover {
      text-decoration: underline;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }

    .checkbox-group label.checkbox-label {
      display: inline;
      margin: 0;
      font-weight: 400;
      color: #666;
      cursor: pointer;
      user-select: none;
    }

    [data-theme="dark"] .checkbox-group label.checkbox-label {
      color: #b0b0b0;
    }

    /* 聊天界面 */
    #chat-app {
      display: none;
      flex-direction: column;
      height: 100%;
      flex: 1; /* 占据剩余空间，让footer保持在底部 */
      overflow: hidden; /* 让内部的#chat处理滚动 */
    }

    #status {
      padding: 8px 12px;
      background: var(--bg-chat-system);
      font-size: 13px;
      text-align: center;
      color: var(--text-primary);
    }

    .connected {
      background: #07C160 !important;
      color: white !important;
    }

    #chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      overflow-x: hidden; /* 防止消息内容导致水平滚动 */
      -webkit-overflow-scrolling: touch;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    [data-theme="dark"] #chat {
      background: #1a1a1a;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      max-width: 70%;
      word-wrap: break-word;
      line-height: 1.6;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .msg.mine {
      background: var(--bg-chat-mine);
      margin-left: auto;
      margin-right: 0;
      align-self: flex-end;
      color: #333;
    }

    .msg.other {
      background: var(--bg-chat-other);
      margin-right: auto;
      margin-left: 0;
      align-self: flex-start;
      border: 1px solid #eeeeee;
    }

    [data-theme="dark"] .msg.other {
      border-color: #444444;
    }

    .msg.system {
      background: var(--bg-chat-system);
      text-align: center;
      font-size: 13px;
      margin-left: auto;
      margin-right: auto;
      align-self: center;
      max-width: 90%;
      padding: 6px 12px;
      color: #666;
    }

    .msg-sender {
      font-weight: 500;
      color: var(--bg-button);
      font-size: 12px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .msg-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-left: 8px;
    }

    .msg-recall {
      background: var(--bg-chat-system) !important;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* 公告消息特殊样式 */
    .msg.announcement {
      background: #fff3cd !important;
      border: 2px solid #ffc107;
      text-align: center;
      font-weight: 500;
      margin-left: auto;
      margin-right: auto;
      align-self: center;
      max-width: 90%;
    }

    [data-theme="dark"] .msg.announcement {
      background: #5c4d00 !important;
      border-color: #ffca28;
    }

    .msg.announcement .msg-sender {
      color: #856404;
      font-weight: 600;
      justify-content: center;
      margin-bottom: 6px;
    }

    [data-theme="dark"] .msg.announcement .msg-sender {
      color: #ffca28;
    }

    .recall-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 10px;
      cursor: pointer;
      padding: 2px 6px;
      width: auto;
    }

    .recall-btn:hover {
      color: var(--bg-button);
    }

    footer {
      display: flex;
      border-top: 1px solid var(--border-color);
      padding: 12px 15px;
      background: #f7f7f7;
      flex-shrink: 0; /* 防止footer被压缩，始终保持在底部 */
    }

    [data-theme="dark"] footer {
      background: #2a2a2a;
    }

    #message-input {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-right: 10px;
      background: white;
      color: #333;
      /* 移动端优化：防止缩放和保持焦点 */
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      /* 移动端防止键盘收起时布局跳动 */
      position: relative;
    }

    [data-theme="dark"] #message-input {
      background: #3a3a3a;
      border-color: #444444;
      color: #e0e0e0;
    }

    #message-input:focus {
      outline: none;
      border-color: #07C160;
    }

    #send-btn {
      width: auto;
      padding: 10px 20px;
      background: #07C160;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      transition: background-color 0.2s;
    }

    #send-btn:hover {
      background: #06AD56;
    }

    #send-btn:active {
      background: #05994D;
    }

    /* 表情选择器 */
    #emoji-picker {
      position: absolute;
      bottom: 80px;
      right: 15px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      box-shadow: var(--shadow);
      z-index: 300;
      display: none;
      max-width: 280px;
      max-height: 300px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #emoji-picker.show {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }

    .emoji-btn {
      font-size: 20px;
      padding: 5px;
      cursor: pointer;
      border: none;
      background: transparent;
      width: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .emoji-btn:hover {
      background: var(--bg-primary);
    }

    #emoji-toggle {
      cursor: pointer;
      font-size: 20px;
      padding: 10px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 管理员面板 */
    #admin-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      z-index: 500;
      display: none;
      box-shadow: var(--shadow);
      max-width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    #admin-panel.show {
      display: block;
    }

    #admin-panel h2 {
      margin-top: 0;
      color: var(--bg-button);
    }

    .admin-section {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .admin-section:last-child {
      border-bottom: none;
    }

    /* 修改密码模态框 */
    #change-password-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 8px;
      padding: 30px;
      z-index: 600;
      display: none;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
      max-width: 90%;
      width: 400px;
    }

    [data-theme="dark"] #change-password-modal {
      background: #2e2e2e;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
    }

    #change-password-modal.show {
      display: block;
    }

    #change-password-modal h2 {
      margin-top: 0;
      color: #07C160;
      margin-bottom: 20px;
      text-align: center;
    }

    /* 密码输入框包装器 */
    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .password-input-wrapper input {
      flex: 1;
      padding-right: 50px;
      border-radius: 4px;
    }

    .password-input-wrapper input:focus {
      border-color: #07C160;
    }

    [data-theme="dark"] .password-input-wrapper input:focus {
      border-color: #07C160;
    }

    /* 密码显示/隐藏按钮 */
    .password-toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 6px 8px;
      color: #999;
      transition: color 0.2s;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
    }

    [data-theme="dark"] .password-toggle-btn {
      color: #b0b0b0;
    }

    .password-toggle-btn:hover {
      color: #07C160;
    }

    .user-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      margin-bottom: 8px;
      background: var(--bg-primary);
      border-radius: 4px;
    }

    .user-actions {
      display: flex;
      gap: 5px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      width: auto;
    }

    .btn-danger {
      background: var(--bg-button-danger);
    }

    .btn-danger:hover {
      background: var(--bg-button-danger-hover);
    }

    /* 加载动画 */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #loading-overlay.show {
      display: flex;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--bg-button);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 网络状态 */
    #network-status {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 100;
      display: none;
      background: #666;
      color: white;
    }

    #network-status.show {
      display: block;
    }

    #network-status.online {
      background: #1b5e20;
    }

    #network-status.offline {
      background: #d32f2f;
    }

    /* 响应式设计 */
    @media (max-width: 600px) {
      #app {
        max-width: 100%;
      }

      #auth-forms {
        padding: 20px;
      }

      .msg {
        max-width: 90%;
      }

      #online-users-panel {
        top: 0;
        right: 0;
        width: 80%;
        max-width: none;
        max-height: 100vh;
        border-left: none;
        border-left: 2px solid var(--border-color);
      }

      .header-btn {
        padding: 6px 10px;
        font-size: 12px;
      }

      .header-title {
        font-size: 16px;
      }

      footer {
        padding: 8px;
        flex-direction: row;
        align-items: center;
        flex-shrink: 0; /* 防止footer被压缩，始终保持在底部 */
      }

      #message-input {
        flex: 1;
        font-size: 16px; /* 防止 iOS 自动缩放 */
        margin: 0 8px;
      }

      #emoji-toggle {
        font-size: 18px;
        padding: 8px;
      }

      #send-btn {
        padding: 10px 14px;
        font-size: 14px;
      }

      #emoji-picker {
        right: 5px;
        bottom: 65px;
        max-width: 250px;
        max-height: 250px;
      }
    }

    /* 加密信息 */
    .encryption-info {
      font-size: 11px;
      color: #07C160;
      margin-top: 4px;
    }

    .encryption-warning {
      font-size: 11px;
      color: #fa5151;
      margin-top: 8px;
      padding: 8px;
      background: #fef0f0;
      border-radius: 4px;
    }

    [data-theme="dark"] .encryption-warning {
      background: #3d1a1a;

  <script>
    let ws = null;
    let currentUser = null;
    let authToken = null;
    let sessionKey = null;        // CryptoKey (AES-256-GCM)，每次登录重新生成
    let rsaPublicKey = null;      // RSA 公钥 PEM 字符串
    let rsaCryptoKey = null;     // CryptoKey (RSA-OAEP)
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 5;
    const reconnectDelay = 3000;
    let heartbeatInterval = null;
    let isAdmin = false;
    let messages = {};
    let currentTheme = localStorage.getItem('theme') || 'light';

    // ==================== Web Crypto API 工具函数 ====================

    // PEM 转 ArrayBuffer
    function pemToArrayBuffer(pem) {
      const b64 = pem.replace(/-----[A-Z ]+-----/g, '').replace(/\s/g, '');
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    // ArrayBuffer 转 base64
    function bufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    // base64 转 Uint8Array
    function base64ToUint8Array(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    // 导入 RSA 公钥为 CryptoKey
    async function importRsaPublicKey(pem) {
      const der = pemToArrayBuffer(pem);
      return await crypto.subtle.importKey(
        'spki', der,
        { name: 'RSA-OAEP', hash: 'SHA-256' },
        false, ['encrypt']
      );
    }

    // 获取 RSA 公钥 + 公钥指纹 TOFU 校验
    async function getRSAPublicKey() {
      try {
        const response = await fetch('/api/public-key');
        const data = await response.json();
        const fingerprint = data.public_key_fingerprint;

        // TOFU: 首次存储指纹，后续校验一致性，检测 MITM 公钥替换
        const stored = localStorage.getItem('rsa_key_fingerprint');
        if (stored && stored !== fingerprint) {
          throw new Error('RSA 公钥指纹变更，可能存在中间人攻击');
        }
        localStorage.setItem('rsa_key_fingerprint', fingerprint);

        rsaPublicKey = data.public_key;
        rsaCryptoKey = await importRsaPublicKey(data.public_key);
        return data.public_key;
      } catch (error) {
        console.error('获取 RSA 公钥失败:', error);
        return null;
      }
    }

    // RSA-OAEP 加密（用于密码传输）
    async function rsaEncrypt(plaintext) {
      if (!rsaCryptoKey) {
        console.error('RSA 公钥未加载');
        return null;
      }
      const encoded = new TextEncoder().encode(plaintext);
      const encrypted = await crypto.subtle.encrypt(
        { name: 'RSA-OAEP' }, rsaCryptoKey, encoded
      );
      return bufferToBase64(encrypted);
    }

    // 生成随机 session key 并用 RSA-OAEP 加密（密钥封装）
    async function generateAndEncryptSessionKey() {
      // 生成随机 AES-256-GCM session key
      sessionKey = await crypto.subtle.generateKey(
        { name: 'AES-GCM', length: 256 },
        true, ['encrypt', 'decrypt']
      );
      // 导出 raw key bytes，用 RSA-OAEP 加密后传输
      const rawKey = await crypto.subtle.exportKey('raw', sessionKey);
      const encryptedKey = await crypto.subtle.encrypt(
        { name: 'RSA-OAEP' }, rsaCryptoKey, rawKey
      );
      return bufferToBase64(encryptedKey);
    }

    // AES-256-GCM 消息加密（与后端 MessageEncryptor 格式一致）
    async function encryptMessage(message) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(message);
      const ciphertextBuf = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: iv }, sessionKey, encoded
      );
      // 格式: iv(12) + ciphertext + tag(16)
      const combined = new Uint8Array(iv.length + ciphertextBuf.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(ciphertextBuf), iv.length);
      return bufferToBase64(combined.buffer);
    }

    // AES-256-GCM 消息解密
    async function decryptMessage(ciphertextB64) {
      try {
        const combined = base64ToUint8Array(ciphertextB64);
        const iv = combined.slice(0, 12);
        const ciphertextTag = combined.slice(12);
        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv }, sessionKey, ciphertextTag
        );
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return '🔒 加密消息：密钥不匹配，无法解密';
      }
    }

    // XSS防护函数
    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 常用表情
    const emojis = [
      '😀', '😃', '😄', '😁', '😅', '😂', '🤣', '😊',
      '😇', '🙂', '😉', '😌', '😍', '🥰', '😘', '😗',
      '😙', '😚', '😋', '😛', '😜', '🤪', '😝', '🤑',
      '🤗', '🤭', '🤫', '🤔', '🤐', '🤨', '😐', '😑',
      '😶', '😏', '😒', '🙄', '😬', '🤥', '😌', '😔',
      '😪', '🤤', '😴', '😷', '🤒', '🤕', '🤢', '🤮',
      '🤧', '🥵', '🥶', '🥴', '😵', '🤯', '🤠', '🥳',
      '😎', '🤓', '🧐', '😕', '😟', '🙁', '😮', '😯'
    ];

    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
      // 设置主题
      if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }

      // 初始化表情选择器
      initEmojiPicker();

      // 检查网络状态
      checkNetworkStatus();

      // 尝试从 sessionStorage 恢复登录状态和聊天记录
      const savedUsername = sessionStorage.getItem('current_user');
      if (savedUsername) {
        const savedToken = sessionStorage.getItem(`token_${savedUsername}`);
        const savedSessionKeyB64 = sessionStorage.getItem(`session_key_${savedUsername}`);
        if (savedToken && savedSessionKeyB64) {
          currentUser = savedUsername;
          authToken = savedToken;
          try {
            // 从 base64 恢复 session key
            const rawKey = base64ToUint8Array(savedSessionKeyB64);
            sessionKey = await crypto.subtle.importKey(
              'raw', rawKey, { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']
            );
            // 获取 RSA 公钥
            await getRSAPublicKey();
            // 用 RSA-OAEP 加密已有的 raw session key（不重新生成）
            const encryptedKey = await crypto.subtle.encrypt(
              { name: 'RSA-OAEP' }, rsaCryptoKey, rawKey
            );
            const encryptedSessionKey = bufferToBase64(encryptedKey);
            restoreMessages();
            connectWebSocket(savedToken, encryptedSessionKey);
          } catch (e) {
            console.error('恢复会话失败:', e);
            sessionStorage.removeItem('current_user');
          }
        } else {
          sessionStorage.removeItem('current_user');
        }
      }

      window.addEventListener('online', () => {
        showNetworkStatus('online');
        reconnectWebSocket();
      });

      window.addEventListener('offline', () => {
        showNetworkStatus('offline');
      });
    });

    // 初始化表情选择器
    function initEmojiPicker() {
      const picker = document.getElementById('emoji-picker');
      emojis.forEach(emoji => {
        const btn = document.createElement('button');
        btn.className = 'emoji-btn';
        btn.textContent = emoji;

          input.value += emoji;
          input.focus();
          picker.classList.remove('show');

        picker.appendChild(btn);
      });
    }

    // 滚动到底部
    function scrollToBottom() {
      const chatDiv = document.getElementById('chat');
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // 切换表情选择器
    function toggleEmojiPicker() {
      const picker = document.getElementById('emoji-picker');
      picker.classList.toggle('show');

      if (picker.classList.contains('show')) {
        // 检查是否超出右边界
        const rect = picker.getBoundingClientRect();
        const windowWidth = window.innerWidth;
        if (rect.right > windowWidth - 10) {
          picker.style.right = '10px';
          picker.style.left = 'auto';
        } else {
          picker.style.right = '15px';
          picker.style.left = 'auto';
        }
      }
    }

    // 切换主题
    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('theme', currentTheme);
    }

    // 检查网络状态
    function checkNetworkStatus() {
      if (navigator.onLine) {
        showNetworkStatus('online');
      } else {
        showNetworkStatus('offline');
      }
    }

    function showNetworkStatus(status) {
      const statusEl = document.getElementById('network-status');
      statusEl.textContent = status === 'online' ? '网络已连接' : '网络已断开';
      statusEl.className = status;
      statusEl.classList.add('show');

      setTimeout(() => {
        statusEl.classList.remove('show');
      }, 3000);
    }

    // 密码强度检查
    function checkPasswordStrength() {
      const password = document.getElementById('reg-password').value;
      const bar = document.getElementById('password-strength-bar');
      const text = document.getElementById('password-strength-text');

      let strength = 0;
      let strengthText = '';
      let strengthColor = '';

      if (password.length >= 8) strength++;
      if (password.match(/[a-z]/)) strength++;
      if (password.match(/[A-Z]/)) strength++;
      if (password.match(/[0-9]/)) strength++;
      if (password.match(/[^a-zA-Z0-9]/)) strength++;

      switch(strength) {
        case 0:
        case 1:
          strengthText = '弱';
          strengthColor = '#dc3545';
          break;
        case 2:
          strengthText = '较弱';
          strengthColor = '#fd7e14';
          break;
        case 3:
          strengthText = '中等';
          strengthColor = '#ffc107';
          break;
        case 4:
          strengthText = '强';
          strengthColor = '#28a745';
          break;
        case 5:
          strengthText = '很强';
          strengthColor = '#1b5e20';
          break;
      }

      bar.style.width = (strength / 5 * 100) + '%';
      bar.style.backgroundColor = strengthColor;
      text.textContent = '密码强度: ' + strengthText;
      text.style.color = strengthColor;
    }

    // encryptMessage 和 decryptMessage 已在上方 Web Crypto API 部分定义

    // 显示登录表单
    function showLogin() {
      document.getElementById("login-form").classList.add("active");
      document.getElementById("register-form").classList.remove("active");
      clearMessages();
    }

    // 显示注册表单
    function showRegister() {
      document.getElementById("login-form").classList.remove("active");
      document.getElementById("register-form").classList.add("active");
      clearMessages();
    }

    // 清除消息
    function clearMessages() {
      document.getElementById("login-error").classList.remove("show");
      document.getElementById("login-success").classList.remove("show");
      document.getElementById("register-error").classList.remove("show");
      document.getElementById("register-success").classList.remove("show");
    }

    // 显示加载
    function showLoading() {
      document.getElementById('loading-overlay').classList.add('show');
    }

    // 隐藏加载
    function hideLoading() {
      document.getElementById('loading-overlay').classList.remove('show');
    }

    // 注册
    async function register() {
      const username = document.getElementById("reg-username").value.trim();
      const password = document.getElementById("reg-password").value;
      const confirmPassword = document.getElementById("reg-password-confirm").value;

      const errorDiv = document.getElementById("register-error");
      const successDiv = document.getElementById("register-success");
      const regBtn = document.getElementById("reg-btn");

      // 验证输入
      if (!username || username.length < 3 || username.length > 20) {
        errorDiv.textContent = "用户名长度必须在3-20个字符之间";
        errorDiv.classList.add("show");
        successDiv.classList.remove("show");
        return;
      }

      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        errorDiv.textContent = "用户名只能包含字母、数字和下划线";
        errorDiv.classList.add("show");
        successDiv.classList.remove("show");
        return;
      }

      // 验证密码强度（必须包含大小写字母、数字和特殊字符）
      if (!password || password.length < 8) {
        errorDiv.textContent = "密码长度必须至少8个字符";
        errorDiv.classList.add("show");
        successDiv.classList.remove("show");
        return;
      }

      if (!/[a-z]/.test(password)) {
        errorDiv.textContent = "密码必须包含至少一个小写字母";
        errorDiv.classList.add("show");
        successDiv.classList.remove("show");
        return;
      }

      if (!/[A-Z]/.test(password)) {
        errorDiv.textContent = "密码必须包含至少一个大写字母";
        errorDiv.classList.add("show");
        successDiv.classList.remove("show");
        return;
      }

      if (!/[0-9]/.test(password)) {
        errorDiv.textContent = "密码必须包含至少一个数字";
        errorDiv.classList.add("show");
        successDiv.classList.remove("show");
        return;
      }

      if (!/[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(password)) {
        errorDiv.textContent = "密码必须包含至少一个特殊字符 (!@#$%^&*()_+-=[]{}|;:,.<>?)";
        errorDiv.classList.add("show");
        successDiv.classList.remove("show");
        return;
      }

      if (password !== confirmPassword) {
        errorDiv.textContent = "两次输入的密码不一致";
        errorDiv.classList.add("show");
        successDiv.classList.remove("show");
        return;
      }

      errorDiv.classList.remove("show");
      successDiv.classList.remove("show");
      showLoading();
      regBtn.disabled = true;
      regBtn.textContent = "注册中...";

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.detail || "注册失败");
        }

        const data = await response.json();
        successDiv.textContent = data.message + "，请登录";
        successDiv.classList.add("show");

        setTimeout(() => {
          showLogin();
          document.getElementById("login-username").value = username;
          document.getElementById("login-password").value = "";
        }, 2000);

      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.add("show");

        regBtn.disabled = false;
        regBtn.textContent = "注册";

    // 登录
    async function login() {
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;

      const errorDiv = document.getElementById("login-error");
      const loginBtn = document.getElementById("login-btn");

      if (!username || !password) {
        errorDiv.textContent = "请输入用户名和密码";
        errorDiv.classList.add("show");
        return;
      }

      errorDiv.classList.remove("show");
      showLoading();
      loginBtn.disabled = true;
      loginBtn.textContent = "登录中...";

      try {
        // 获取 RSA 公钥（含 TOFU 指纹校验）
        const publicKey = await getRSAPublicKey();
        if (!publicKey) {
          throw new Error("无法获取加密密钥，请刷新页面重试");
        }

        // RSA-OAEP 加密密码
        const encryptedPassword = await rsaEncrypt(password);
        if (!encryptedPassword) {
          throw new Error("密码加密失败，请刷新页面重试");
        }

        // 生成随机 session key 并用 RSA-OAEP 加密（密钥封装）
        const encryptedSessionKey = await generateAndEncryptSessionKey();
        if (!encryptedSessionKey) {
          throw new Error("会话密钥生成失败，请刷新页面重试");
        }

        const response = await fetch("/token", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            encrypted_password: encryptedPassword
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.detail || "登录失败");
        }

        const data = await response.json();
        currentUser = data.username;
        authToken = data.access_token;

        // 保存到 sessionStorage
        sessionStorage.setItem(`token_${currentUser}`, data.access_token);
        sessionStorage.setItem('current_user', currentUser);
        // 保存 raw session key（base64）用于刷新后恢复
        const rawKey = await crypto.subtle.exportKey('raw', sessionKey);
        sessionStorage.setItem(`session_key_${currentUser}`, bufferToBase64(rawKey));

        // 连接 WebSocket（发送加密的 session key）
        connectWebSocket(data.access_token, encryptedSessionKey);

      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.add("show");
        loginBtn.disabled = false;
        loginBtn.textContent = "登录";
      } finally {
        hideLoading();
      }
    }

    // 连接 WebSocket
    function connectWebSocket(token, encryptedSessionKey) {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const host = window.location.hostname;
      const port = window.location.port ? `:${window.location.port}` : "";
      ws = new WebSocket(`${protocol}//${host}${port}/ws`);

      ws.onopen = async () => {
        reconnectAttempts = 0;
        showNetworkStatus('online');

        // 发送认证信息（token + RSA-OAEP 加密的 session key）
        await ws.send(JSON.stringify({
          token: token,
          encrypted_session_key: encryptedSessionKey
        }));

        // 启动心跳
        startHeartbeat();
      };

      ws.onmessage = async (e) => {
        const d = JSON.parse(e.data);
        const chatDiv = document.getElementById("chat");

        if (d.type === "connected") {
          document.getElementById("auth-forms").style.display = "none";
          document.getElementById("chat-app").style.display = "flex";
          document.getElementById("header").style.display = "flex";
          document.getElementById("status").classList.add("connected");
          document.getElementById("status").textContent = d.message;

          if (d.is_admin) {
            isAdmin = true;
            document.getElementById("admin-btn").style.display = "block";
          }

          hideLoading();
          setTimeout(() => scrollToBottom(), 100);
          return;
        }

        if (d.type === "error") {
          hideLoading();
          document.getElementById("status").classList.remove("connected");
          document.getElementById("status").textContent = "✗ " + d.message;

          if (d.message.includes("Invalid token") || d.message.includes("用户不存在")) {
            forceLogout();
          }
          return;
        }

        if (d.type === "heartbeat") {
          return;
        }

        if (d.type === "online_users") {
          updateOnlineUsers(d.users, d.count);
          return;
        }

        if (d.type === "recall") {
          const msgEl = document.querySelector(`[data-message-id="${d.message_id}"]`);
          if (msgEl) {
            msgEl.classList.add('msg-recall');
            msgEl.querySelector('.msg-content').textContent = '[消息已撤回]';
          }
          return;
        }

        // 处理消息（AES-256-GCM 异步解密）
        const msgDiv = document.createElement("div");
        msgDiv.className = "msg";
        const sender = d.sender || "系统";
        const isMine = sender === currentUser;
        const messageId = d.message_id || '';

        if (messageId) {
          msgDiv.setAttribute('data-message-id', messageId);
          messages[messageId] = {
            id: messageId,
            sender: sender,
            time: d.time
          };
        }

        if (d.type === "system") {
          msgDiv.className += " system";
          const decryptedMsg = await decryptMessage(d.message);
          msgDiv.innerHTML = `<div class="msg-time">${new Date(d.time*1000).toLocaleTimeString()}</div>${escapeHTML(decryptedMsg)}`;
        } else if (d.type === "message" || d.type === "announcement") {
          if (d.type === "announcement") {
            msgDiv.className += " announcement";
          } else {
            msgDiv.className += isMine ? " mine" : " other";
          }

          const decryptedMsg = await decryptMessage(d.message);

          let recallBtn = '';
          if (isMine && d.type === "message") {
            recallBtn = `<button class="recall-btn" onclick="recallMessage('${messageId}')">撤回</button>`;
          }

          msgDiv.innerHTML = `
            <div class="msg-sender">
              <span>${escapeHTML(sender)}</span>
              ${recallBtn}
              <span class="msg-time">${new Date(d.time*1000).toLocaleTimeString()}</span>
            </div>
            <div class="msg-content">${escapeHTML(decryptedMsg)}</div>
          `;
        }

        chatDiv.appendChild(msgDiv);

        // 保存消息到 sessionStorage
        saveMessage(d);

        // 自动滚动到底部
        scrollToBottom();
      };

      ws.onclose = (event) => {
        stopHeartbeat();
        hideLoading();
        document.getElementById("status").classList.remove("connected");

        const reason = event.reason || "连接已断开";
        document.getElementById("status").textContent = "✗ " + reason;

        // 检查是否是被动断开（被踢出、禁用或锁定）
        if (reason.includes("踢出") || reason.includes("禁用") || reason.includes("锁定") || event.code === 1008) {
          alert(reason);
          forceLogout(); // 强制退出
          return;
        }

        // 如果 token 无效，清除登录状态
        if (reason.includes("Invalid token") || event.code === 1008) {
          forceLogout();
          return;
        }

        // 尝试重连
        if (reconnectAttempts < maxReconnectAttempts) {
          reconnectAttempts++;
          setTimeout(() => {
            console.log(`尝试重连 (${reconnectAttempts}/${maxReconnectAttempts})...`);
            reconnectWebSocket();
          }, reconnectDelay);
        } else {
          // 重连次数用尽，重置登录按钮状态
          const loginBtn = document.getElementById("login-btn");
          loginBtn.disabled = false;
          loginBtn.textContent = "登录";
        }
      };

      ws.onerror = (error) => {
        hideLoading();
        document.getElementById("status").textContent = "✗ 连接错误";
        console.error("WebSocket 错误:", error);

        // 重置登录按钮状态
        const loginBtn = document.getElementById("login-btn");
        loginBtn.disabled = false;
        loginBtn.textContent = "登录";
      };
    }

    // 保存消息到 sessionStorage
    function saveMessage(msgData) {
      const chatHistory = getChatHistory();
      chatHistory.push(msgData);
      // 限制最多保存 500 条消息
      if (chatHistory.length > 500) {
        chatHistory.shift();
      }
      sessionStorage.setItem('chat_history', JSON.stringify(chatHistory));
    }

    function getChatHistory() {

        return history ? JSON.parse(history) : [];

      const chatDiv = document.getElementById("chat");

            id: messageId,

        if (d.type === "system") {

          msgDiv.innerHTML = `<div class="msg-time">${new Date(d.time*1000).toLocaleTimeString()}</div>${escapeHTML(decryptedMsg)}`;
        } else if (d.type === "message" || d.type === "announcement") {
          if (d.type === "announcement") {
            msgDiv.className += " announcement";

            msgDiv.className += isMine ? " mine" : " other";
          }

          const decryptedMsg = await decryptMessage(d.message);

            recallBtn = `<button class="recall-btn" onclick="recallMessage('${messageId}')">撤回</button>`;
          }

            <div class="msg-sender">

              ${recallBtn}
              <span class="msg-time">${new Date(d.time*1000).toLocaleTimeString()}</span>
            </div>
            <div class="msg-content">${escapeHTML(decryptedMsg)}</div>
          `;
        }

        chatDiv.appendChild(msgDiv);

      // 使用 requestAnimationFrame 确保DOM渲染完成后滚动到底部
      requestAnimationFrame(() => {
        scrollToBottom();
      });
    }

    // 清除聊天历史
    function clearChatHistory() {
      sessionStorage.removeItem('chat_history');
    }


    // 重连 WebSocket
    async function reconnectWebSocket() {
      if (currentUser && authToken && (!ws || ws.readyState === WebSocket.CLOSED)) {
        console.log("重连中...");
        try {
          // 重新用 RSA-OAEP 加密 session key
          const rawKey = await crypto.subtle.exportKey('raw', sessionKey);
          const encryptedKey = await crypto.subtle.encrypt(
            { name: 'RSA-OAEP' }, rsaCryptoKey, rawKey
          );
          const encryptedSessionKey = bufferToBase64(encryptedKey);
          connectWebSocket(authToken, encryptedSessionKey);
        } catch (e) {
          console.error("重连失败:", e);
        }
      }
    }

    // 启动心跳
    function startHeartbeat() {
      if (heartbeatInterval) {
        clearInterval(heartbeatInterval);
      }
      heartbeatInterval = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "heartbeat" }));
        }
      }, 30000);
    }

    // 停止心跳
    function stopHeartbeat() {
      if (heartbeatInterval) {
        clearInterval(heartbeatInterval);
        heartbeatInterval = null;
      }
    }

    // 发送消息
    async function send() {
      const input = document.getElementById("message-input");
      const message = input.value.trim();

      if (message && ws && ws.readyState === WebSocket.OPEN) {
        const encryptedMsg = await encryptMessage(message);
        ws.send(JSON.stringify({ message: encryptedMsg, type: "message" }));
        input.value = "";

        // 移动端保持输入框焦点，防止键盘收起
        setTimeout(() => {
          input.focus();
        }, 50);
      }
    }

    // 撤回消息
    function recallMessage(messageId) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: "recall",
          message_id: messageId
        }));
      }
    }

    // 检查新密码强度
    function checkNewPasswordStrength() {
      const password = document.getElementById('change-new-password').value;
      const bar = document.getElementById('new-password-strength-bar');
      const text = document.getElementById('new-password-strength-text');

      let strength = 0;
      let strengthText = '';
      let strengthColor = '';

      if (password.length >= 8) strength++;
      if (password.match(/[a-z]/)) strength++;
      if (password.match(/[A-Z]/)) strength++;
      if (password.match(/[0-9]/)) strength++;
      if (password.match(/[^a-zA-Z0-9]/)) strength++;

      switch(strength) {
        case 0:
        case 1:
          strengthText = '弱';
          strengthColor = '#dc3545';
          break;
        case 2:
          strengthText = '一般';
          strengthColor = '#ffc107';
          break;
        case 3:
        case 4:
          strengthText = '强';
          strengthColor = '#28a745';
          break;
        case 5:
          strengthText = '很强';
          strengthColor = '#07C160';
          break;
      }

      bar.style.width = password ? (strength * 20) + '%' : '0';
      bar.style.backgroundColor = strengthColor;
      text.textContent = password ? strengthText : '';
    }

          },
          body: JSON.stringify({
            old_password: oldPassword,
            new_password: newPassword
          })
        });

        if (response.ok) {
          alert('密码修改成功，请重新登录');
          closeChangePasswordModal();
          forceLogout(); // 强制退出，不需要确认
        } else if (response.status === 401) {
          // Token过期或无效，强制登出
          alert('登录已过期，请重新登录');
          forceLogout();
        } else {
          const errorData = await response.json();
          alert('修改失败: ' + errorData.detail);
        }
      } catch (error) {
        alert('修改失败: ' + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '确认修改';
      }
    }

    // 修改密码（保留旧函数以兼容）
    async function changePassword(oldPassword, newPassword) {
      try {
        const token = sessionStorage.getItem(`token_${currentUser}`);
        if (!token) {
          alert('登录已过期，请重新登录');
          return;
        }

        const response = await fetch('/api/user/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            old_password: oldPassword,
            new_password: newPassword
          })
        });

        if (response.ok) {
          alert('密码修改成功，请重新登录');
          logout();
        } else if (response.status === 401) {
          // Token过期或无效，强制登出
          alert('登录已过期，请重新登录');
          forceLogout();
        } else {
          const errorData = await response.json();
          alert('修改失败: ' + errorData.detail);
        }
      } catch (error) {
        alert('修改失败: ' + error.message);
      }
    }

    // 强制退出登录（不显示确认框）
    function forceLogout() {
      stopHeartbeat();
      if (ws) {
        ws.close();
      }
      // 清除当前用户的 token
      if (currentUser) {
        sessionStorage.removeItem(`token_${currentUser}`);
        sessionStorage.removeItem(`encryption_key_${currentUser}`);
      }
      sessionStorage.removeItem('current_user');
      currentUser = null;
      authToken = null;
      encryptionKey = null;
      isAdmin = false;

      document.getElementById("chat-app").style.display = "none";
      document.getElementById("header").style.display = "none";
      document.getElementById("auth-forms").style.display = "flex";
      document.getElementById("login-form").classList.add("active");
      document.getElementById("register-form").classList.remove("active");
      document.getElementById("chat").innerHTML = "";
      document.getElementById("message-input").value = "";
      document.getElementById("online-users-panel").classList.remove("show");
      document.getElementById("admin-panel").classList.remove("show");
      document.getElementById("emoji-picker").classList.remove("show");
      document.getElementById("admin-btn").style.display = "none";

      // 重置登录按钮状态
      const loginBtn = document.getElementById("login-btn");
      loginBtn.disabled = false;
      loginBtn.textContent = "登录";
    }

    // 退出登录
    function logout() {
      if (confirm("确定要退出吗？")) {
        stopHeartbeat();
        if (ws) {
          ws.close();
        }
        // 清除当前用户的 token
        if (currentUser) {
          sessionStorage.removeItem(`token_${currentUser}`);
          sessionStorage.removeItem(`encryption_key_${currentUser}`);
        }
        sessionStorage.removeItem('current_user');
        currentUser = null;
        authToken = null;
        encryptionKey = null;
        isAdmin = false;

        document.getElementById("chat-app").style.display = "none";
        document.getElementById("header").style.display = "none";
        document.getElementById("auth-forms").style.display = "flex";
        document.getElementById("login-form").classList.add("active");
        document.getElementById("register-form").classList.remove("active");
        document.getElementById("chat").innerHTML = "";
        document.getElementById("message-input").value = "";
        document.getElementById("online-users-panel").classList.remove("show");
        document.getElementById("admin-panel").classList.remove("show");
        document.getElementById("emoji-toggle").classList.remove("show");
        document.getElementById("admin-btn").style.display = "none";

        // 重置登录按钮状态
        const loginBtn = document.getElementById("login-btn");
        loginBtn.disabled = false;
        loginBtn.textContent = "登录";

        // 清除聊天历史
        clearChatHistory();
      }
    }

    // 回车发送
    document.getElementById("message-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        // 防止回车键导致输入框失去焦点
        e.preventDefault();
        send();
      }
    });

    // 回车登录
    document.getElementById("login-password").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        login();
      }
    });

    // 回车注册
    document.getElementById("reg-password-confirm").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        register();
      }
    });

    // 点击其他地方关闭面板
    document.addEventListener('click', (e) => {
      const emojiPicker = document.getElementById('emoji-picker');
      const emojiToggle = document.getElementById('emoji-toggle');
      const onlinePanel = document.getElementById('online-users-panel');
      const onlineBtn = document.querySelector('[onclick="showOnlineUsers()"]');

      if (!emojiPicker.contains(e.target) && !emojiToggle.contains(e.target)) {
        emojiPicker.classList.remove('show');
        // 重置位置
        emojiPicker.style.right = '15px';
        emojiPicker.style.left = 'auto';
      }

      if (!onlinePanel.contains(e.target) && !onlineBtn.contains(e.target)) {
        onlinePanel.classList.remove('show');
      }
    });
  </script>
</body>
</html>
